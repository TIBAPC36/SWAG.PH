<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | SWAGPH</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container { max-width: 450px; margin: 60px auto; padding: 30px; }
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-weight: 600; color: #475569; font-size: 0.9rem; }
        .form-group input { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }
        .btn-submit { background: #3498db; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        .btn-submit:hover { background: #2980b9; }
        .error-msg { color: #e74c3c; font-size: 0.85rem; display: none; margin-bottom: 15px; }
    </style>
</head>
<body style="background-color: #f8fafc;">

<div class="card auth-container">
    <div style="text-align: center; margin-bottom: 25px;">
        <img src="assets/SWAGPH.png" alt="SWAGPH Logo" style="height: 50px; margin-bottom: 10px;">
        <h2>Create an Account</h2>
        <p class="text-muted" style="font-size: 0.9rem;">Register to start requesting custom merchandise quotes.</p>
    </div>

    <div id="register-error" class="error-msg"></div>

    <form id="register-form">
        <div class="form-group">
            <label for="reg-name">Full Name</label>
            <input type="text" id="reg-name" required placeholder="e.g. Juan Dela Cruz">
        </div>

        <div class="form-group">
            <label for="reg-email">Email Address</label>
            <input type="email" id="reg-email" required placeholder="e.g. juan@email.com">
        </div>

        <div class="form-group">
            <label for="reg-phone">Phone Number</label>
            <input type="tel" id="reg-phone" required placeholder="e.g. 09171234567">
        </div>

        <div class="form-group">
            <label for="reg-pass">Password</label>
            <input type="password" id="reg-pass" required placeholder="••••••••" minlength="6">
        </div>

        <button type="submit" class="btn-submit" style="width: 100%;">Create Account</button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
        <p class="text-muted">Already have an account? <a href="login.html" style="color: #3498db; font-weight: 600; text-decoration: none;">Login here</a></p>
    </div>
</div>

<script src="js/register.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | SWAGPH</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .profile-details { margin-top: 20px; display: flex; flex-direction: column; gap: 15px; }
        .profile-row { display: flex; border-bottom: 1px solid #f5f5f5; padding-bottom: 12px; }
        .profile-label { width: 150px; font-weight: 600; color: #475569; }
        .profile-value { color: #0f172a; }
    </style>
</head>
<body>

<script>
    (function enforceGate() {
        const sessionRaw = localStorage.getItem('swag_session');
        if (!sessionRaw) {
            window.location.href = "login.html";
            return;
        }
        const session = JSON.parse(sessionRaw);
        if (session.role !== 'CLIENT') {
            window.location.href = "login.html";
        }
    })();
</script>

<div class="dashboard-container">
    <nav class="sidebar">
        <div class="sidebar-logo-box">
            <img src="assets/SWAGPH.png" class="nav-logo" alt="logo">
        </div>
        <ul>
            <li><a href="client-dashboard.html">My Dashboard</a></li>
            <li><a href="client-orders.html">My Purchases</a></li>
            <li class="active"><a href="client-profile.html">Account Profile</a></li>
            <li><a href="#" id="logout-btn" style="color:#ff7675;">Logout</a></li>
        </ul>
    </nav>

    <main class="main-content" style="padding: 30px;">
        <div class="top-header" style="margin-bottom: 30px;">
            <h1>Account Settings</h1>
            <p class="text-muted">Manage your user registration credentials and communication preferences.</p>
        </div>

        <div class="card" style="max-width: 600px;">
            <h3>Profile Summary</h3>
            <div class="profile-details">
                <div class="profile-row">
                    <div class="profile-label">Full Name</div>
                    <div class="profile-value" id="prof-name">---</div>
                </div>
                <div class="profile-row">
                    <div class="profile-label">Email Address</div>
                    <div class="profile-value" id="prof-email">---</div>
                </div>
                <div class="profile-row">
                    <div class="profile-label">Access Group</div>
                    <div class="profile-value"><span style="background:#3498db; color:white; padding:2px 8px; border-radius:4px; font-size:0.8rem;">Verified Client</span></div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="js/client-profile.js"></script>
</body>
</html>

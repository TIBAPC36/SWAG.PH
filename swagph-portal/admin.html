<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Controls | SWAGPH</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="dashboard-container">

    <nav class="sidebar">
        <div class="sidebar-logo-box">
            <img src="assets/SWAGPH.png" class="nav-logo" alt="SWAGPH Logo">
        </div>

        <ul>
            <li><a href="dashboard.html">Home</a></li>
            <li><a href="order.html">Orders</a></li>
            <li><a href="inventory.html">Inventory</a></li>
            <li><a href="finance.html">Finance</a></li>
            <li class="active"><a href="admin.html">Admin Controls</a></li>
            <li><a href="#" id="logout-btn" style="color: #e74c3c;">Logout</a></li>
        </ul>
    </nav>

    <main class="main-content">

        <div class="top-header">
            <div class="header-titles">
                <h1>Admin Controls</h1>
                <p class="welcome-text">Manage system permissions and access logs</p>
            </div>
            <div class="header-actions">
                <span class="dashboard-date" id="current-date">Thursday, May 21, 2026</span>
            </div>
        </div>

        <div class="card" style="margin-top: 24px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3>Team Directory</h3>
                <button onclick="toggleModal(true)" class="btn-primary" style="padding: 8px 16px; background: #2463eb; color:#fff; border:none; border-radius:6px; cursor:pointer;">+ Add Member</button>
            </div>
            
            <table style="width: 100%;">
                <thead>
                    <tr>
                        <th style="text-align: left; padding: 10px 0;">Name</th>
                        <th style="text-align: left;">Email</th>
                        <th style="text-align: left;">Role</th>
                        <th style="text-align: left;">Status</th>
                        <th style="text-align: right; padding-right: 10px;">Actions</th>
                    </tr>
                </thead>
                <tbody id="staff-table-body">
                    </tbody>
            </table>
            <div id="no-staff-msg" style="display: none; text-align: center; color: #64748b; padding: 20px;">No additional staff members found.</div>
        </div>

        <div class="card activity-card" style="margin-top: 24px;">
            <h3>Security & Audit Log</h3>
            <div id="security-logs" style="margin-top: 15px;">
                </div>
        </div>

    </main>
</div>

<div id="teamModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 1000;">
    <div class="card" style="background: white; padding: 24px; border-radius: 12px; width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);">
        <h3 style="margin-bottom: 15px;">Add New Team Member</h3>
        
        <label style="display:block; margin-bottom: 5px; font-weight:600;">Full Name</label>
        <input type="text" id="staff-name" placeholder="Juan Dela Cruz" style="width: 95%; padding: 10px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius:6px;">
        
        <label style="display:block; margin-bottom: 5px; font-weight:600;">Email Address</label>
        <input type="email" id="staff-email" placeholder="juan@swagph.com" style="width: 95%; padding: 10px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius:6px;">
        
        <label style="display:block; margin-bottom: 5px; font-weight:600;">System Access Role</label>
        <select id="staff-role" style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #cbd5e1; border-radius:6px;">
            <option value="Manager">Manager</option>
            <option value="Inventory Clerk">Inventory Clerk</option>
            <option value="Finance Officer">Finance Officer</option>
        </select>
        
        <div style="display:flex; justify-content: flex-end; gap: 10px;">
            <button onclick="toggleModal(false)" style="padding: 10px 16px; background:#f1f5f9; border:none; border-radius:6px; cursor:pointer;">Cancel</button>
            <button onclick="addStaffMember()" style="padding: 10px 16px; background:#2463eb; color:white; border:none; border-radius:6px; cursor:pointer;">Save Member</button>
        </div>
    </div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
